[project]
name = "agent-failure-lab"
version = "0.1.0"
description = "Every AI agent failure should become a test."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent Failure Lab Contributors" }]
keywords = ["ai", "agents", "benchmark", "testing", "debugging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.9",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
html = []

[project.scripts]
agentlab = "agentlab.cli:app"

[project.urls]
Homepage = "https://github.com/MOSTRE/agent-failure-lab"
Repository = "https://github.com/MOSTRE/agent-failure-lab"
Issues = "https://github.com/MOSTRE/agent-failure-lab/issues"
Changelog = "https://github.com/MOSTRE/agent-failure-lab/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
